[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-das-licitacoes"
version = "0.1.0"
description = "Aplicação Windows do Radar das Licitações"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
radar-licitacoes = "app.main:iniciar_aplicacao"
